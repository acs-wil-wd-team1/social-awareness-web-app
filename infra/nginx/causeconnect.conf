# Install inside Nginx's http context (for example /etc/nginx/conf.d/).
# Origin template: configure HTTPS for the agreed public domain before real use.
server {
    listen 80;
    server_name _;
    root /var/www/causeconnect/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;

    # Choose api-unavailable.conf or api-proxy.conf and install at this path.
    include /etc/nginx/causeconnect-api.conf;

    # Missing static files must not return the React HTML entry page.
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
