# Historical sample-preview template; the live Stage 3 application uses real APIs.
# Include inside the CauseConnect server before the backend is deployed.
location = /api {
    default_type application/json;
    return 503 '{"code":"API_NOT_READY","message":"The backend is not connected to this preview yet."}';
}
location ^~ /api/ {
    default_type application/json;
    return 503 '{"code":"API_NOT_READY","message":"The backend is not connected to this preview yet."}';
}
