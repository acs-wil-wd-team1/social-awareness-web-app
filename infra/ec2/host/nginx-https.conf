limit_req_zone $binary_remote_addr zone=causeconnect_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=causeconnect_register:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=causeconnect_api:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=causeconnect_upload:1m rate=3r/m;
# Never include signed image query strings or Authorization in access logs.
log_format causeconnect_private '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;
    access_log /var/log/nginx/causeconnect-access.log causeconnect_private;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__PUBLIC_IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/causeconnect-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/causeconnect-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:causeconnect_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /srv/causeconnect/current/frontend/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-cache always;
    limit_req_status 429;
    access_log /var/log/nginx/causeconnect-access.log causeconnect_private;

    location ~* ^/api/auth/login/?$ {
        limit_req zone=causeconnect_login burst=5 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location ~* ^/api/auth/register/?$ {
        limit_req zone=causeconnect_register burst=2 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location ~* ^/api/campaign-images/?$ {
        client_max_body_size 6m;
        limit_req zone=causeconnect_upload burst=4 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location ~* ^/api/campaign-images/ {
        # No direct alias to uploads: Express checks visibility/session on each GET.
        # Nginx error entries can include a query string; disable this narrow
        # location's request logs while keeping app errors in the protected journal.
        access_log off;
        error_log /dev/null crit;
        limit_req zone=causeconnect_api burst=60 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location /api/ {
        limit_req zone=causeconnect_api burst=60 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location = /api { return 404; }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
