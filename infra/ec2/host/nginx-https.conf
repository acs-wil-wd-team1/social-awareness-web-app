limit_req_zone $binary_remote_addr zone=causeconnect_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=causeconnect_register:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=causeconnect_api:1m rate=30r/s;

server {
    listen 80 default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__PUBLIC_IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/causeconnect-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/causeconnect-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:causeconnect_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /srv/causeconnect/current/frontend/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-cache always;
    limit_req_status 429;

    location ~* ^/api/auth/login/?$ {
        limit_req zone=causeconnect_login burst=5 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location ~* ^/api/auth/register/?$ {
        limit_req zone=causeconnect_register burst=2 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location /api/ {
        limit_req zone=causeconnect_api burst=60 nodelay;
        include /etc/nginx/causeconnect-proxy.conf;
    }
    location = /api { return 404; }
    location /assets/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
